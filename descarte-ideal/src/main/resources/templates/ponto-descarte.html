<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>DESCARTE IDEAL</title>
    <style>
        .topo{
            font-family: Impact;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 60px;
            background-color: #2DC653;
            color: white;
            display: flex;
            flex-direction: row;
            padding-left: 20px;
            align-items: center;
            gap: 40px;
        }

        .icone {
            width: 46;
            height: 58;
        }

        body {
            margin: 0px;
            background-color: #B7EFC5;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        main{
            margin-top: 80px;
            flex: 1;
        }

        footer{
            width: 100%;
            background-color: #2DC653;
            padding-left: 20px
            font-family: Inria Sans, sans-serif;
            color: white;
        }


        h1 {
            text-align: center;
            color: #155d27;
            font-family: Inria Sans, sans-serif;
            font-size: 60px;
        }

        p {
            font-family: Inria Sans, sans-serif;
        }

        .header-button {
            font-size: Small;
            font-family: Inria Sans, sans-serif;
            width: 200px;
            height: 30px;
            color: white;
            background-color: #155d27;
        }

        .filtro-button {
            padding: 10px;
            font-size: Medium;
            font-family: Inria Sans, sans-serif;
            width: 500px;
            height: 60px;
            color: white;
        }

        button {
            background-color: #2DC653;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        button:hover {
            background-color: #218838;
        }

        .padding{
            padding: 5px;
        }



        form {
            width: 80%;
            margin: 20px auto;
            display: flex;
            gap: 10px;
        }

        form input {
            flex: 1;
            padding: 10px;
            border: 2px solid #1f6b33;
            border-radius: 20px;
        }

        form button {
            padding: 10px 15px;
            border: none;
            background-color: #31c54d;
            border-radius: 20px;
            cursor: pointer;
        }


        .container {
            width: 80%;
            margin: auto;
            padding: 20px;
            border: 2px solid #1f6b33;
        }

        .card {
            background-color: #31c54d;
            padding: 10px;
            border-radius: 10px;
            margin-bottom: 10px;
        }

        .card h3 {
            margin: 0;
        }

        .card p {
            margin: 2px 0;
        }

        .footer-text{
            font-size: 10px;
            padding-left: 10px;
        }

    </style>
</head>


<body>

<header class="topo">
    <h3>DESCARTE IDEAL</h3>

    <button class="header-button" onclick="window.location.href='/solicitacao-denuncia'" type="submit">
        Solicitação Denúncia
    </button>

    <button class="header-button" onclick="window.location.href='/solicitacao-coleta'" type="submit">
        Solicitação Coleta
    </button>

    <button class="header-button" onclick="window.location.href='/verificacao-status'" type="submit">
        Verificacao Status
    </button>
</header>

<main>
    <div>
        <h1 class="padding"> <b> Pontos de Descarte </b> </h1>

        <div>
            <form th:action="@{/pesquisar}" method="get">
                <input type="text" name="pesquisa"
                       placeholder="Pesquise por um ponto de descarte..."
                       th:value="${pesquisa}" required>

                <button type="submit"> Pesquise </button>

                <a th:href="@{/ponto-descarte}">
                    <button type="button">Limpar Pesquisa</button>
                </a>
            </form>
        </div>


        <!--  funcionalidades extra excluida
        <div>
            <button class="filtro-button" onclick="window.location.href='/filtrar-bairro'" type="submit">
                Filtrar por bairro
            </button>

            <button class="filtro-button" onclick="window.location.href='/filtrar-residuo'" type="submit">
                Filtrar por tipos de resíduos
            </button>
        </div>
        -->

        <div class="container">

            <div class="card" th:each="ponto : ${pontos}">
                <h3 th:text="${ponto.nome}"></h3>
                <p th:text="${ponto.rua + ', ' + ponto.numero}"></p>
                <p th:text="${ponto.bairro}"></p>
                <p th:text="${ponto.cep}"></p>
                <p th:text="${ponto.materialAceito}"></p>
            </div>

        </div>

    </div>
</main>

<footer>
    <p class="footer-text"> © 2026 Projeto de Nivelamento. Todos os direitos reservados. </p>
</footer>

</body>
</html>
