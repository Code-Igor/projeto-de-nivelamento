<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>DESCARTE IDEAL</title>
    <style>
        .topo{
            font-family: Inria Sans, sans-serif;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 60px;
            background-color: #2DC653;
            color: white;
            display: flex;
            align-items: center;
            padding-left: 20px;
        }

        .icone {
            width: 46;
            height: 58;
        }

        body {
            margin: 0px;
            background-color: #B7EFC5;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        main{
            margin-top: 80px;
            flex: 1;
        }

        footer{
            width: 100%;
            background-color: #2DC653;
            font-family: Inria Sans, sans-serif;
            color: white;
        }

        .footer-text{
            padding-left:20px;
        }


        h1 {
            text-align: center;
            color: #155d27;
            font-family: Inria Sans, sans-serif;
            font-size: 60px;
        }

        p {
            font-family: Inria Sans, sans-serif;
        }

        button {
            font-size: Large;
            font-family: Inria Sans, sans-serif;
            width: 1000px;
            height: 80px;
            background-color: #2DC653;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        button:hover {
            background-color: #218838;
        }

        .padding{
            padding: 5px;
        }

    </style>
</head>


<body>

<header class="topo">
    <h3><b>DESCARTE IDEAL</b></h3>


</header>

<main>
    <div>

        <h1 class="padding"> <b> DESCARTE IDEAL </b> </h1>

        <div class="padding">
            <p> Descarte Ideal </p>
        </div>

        <div class="padding">
            <button onclick="window.location.href='/ponto-descarte'" type="submit">
                Consultar Pontos de Descarte
            </button>
        </div>

        <div class="padding">
            <button onclick="window.location.href='/solicitacao-denuncia'" type="submit">
                Denunciar Ponto de Descarte Irregular
            </button>
        </div>

        <div class="padding">
            <button onclick="window.location.href='/solicitacao-coleta" type="submit">
                Solicitar Coleta de Objeto de Grande Porte
            </button>
        </div>

        <div class="padding">
            <button onclick="window.location.href='/verificacao-status'" type="submit">
                Verificar Status de Solicitações
            </button>
        </div>
    </div>
</main>

<footer>
    <p class="footer-text"> © 2026 Projeto de Nivelamento. Todos os direitos reservados. </p>
</footer>

</body>
</html>
