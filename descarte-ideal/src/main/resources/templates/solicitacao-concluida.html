<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>DESCARTE IDEAL</title>
    <style>
        .topo{
            font-family: Inria Sans, sans-serif;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 60px;
            background-color: #2DC653;
            color: white;
            display: flex;
            align-items: center;
            padding-left: 20px;
        }


        body {
            margin: 0px;
            background-color: #B7EFC5;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        main{
            margin-top: 80px;
            flex: 1;
        }

        footer{
            width: 100%;
            background-color: #2DC653;
            font-family: Inria Sans, sans-serif;
            color: white;
        }

        .footer-text{
            font-size: 10px;
            padding-left: 10px;
        }

        h2 {
            padding-top: 10px;
            text-align: center;
            color: #155d27;
            font-family: Inria Sans, sans-serif;
            font-size: 40px;
        }

        p {
            font-family: Inria Sans, sans-serif;
        }

        body p{
            font-size: 20px;
            text-align: justify;
        }



        button {

            font-size: Large;
            font-family: Inria Sans, sans-serif;
            width: 1000px;
            height: 80px;
            background-color: #2DC653;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        button:hover {
            background-color: #218838;
        }

        .padding{
            padding: 5px;
            display: flex;
            justify-content: center;
        }

        .container{
            width: 400px;
            margin: 80px auto;
            padding: 30px;
            border: 2px solid #1f6b33;
            border-radius: 10px;
            background-color: #d8f3dc;
        }

    </style>
</head>


<body>

<header class="topo">
    <h3><b>DESCARTE IDEAL</b></h3>


</header>

<main>
    <div class="container">

        <div>
            <h2> <b> Solicitação Concluída </b> </h2>

            <p>
                A sua solicitação foi concluída, agradecemos por usar a nossa aplicação.
            </p>
        </div>

        <div class="padding">
            <button onclick="window.location.href='/'" type="submit">
                Voltar a tela inicial
            </button>
        </div>
    </div>
</main>



</body>
<footer>
    <p class="footer-text"> © 2026 Projeto de Nivelamento. Todos os direitos reservados. </p>
</footer>
</html>
